<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Boston George 420</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #121212; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; user-select: none; }
    .drawer { transition: transform 0.3s ease-in-out; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .media-slider { scroll-snap-type: x mandatory; }
    .media-item { scroll-snap-align: center; }
    .variant-selected { border-color: #10b981 !important; background-color: rgba(16, 185, 129, 0.1) !important; color: white !important; }
  </style>
</head>
<body class="pb-24">

  <script>
    const SUPABASE_URL = "https://hvjzhgixdgozpjqjeipf.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2anpoZ2l4ZGdvenBqcWplaXBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwOTg0ODcsImV4cCI6MjEwMTY3NDQ4N30.WsXI7PtlLM4xqffPyWcjZqxrC0nHGmjurIT0cSVNy6U";
    let db;
    try { db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e) {}
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();
  </script>

  <!-- NAVBAR -->
  <header class="sticky top-0 z-30 bg-[#1e1e1e]/90 backdrop-blur-md px-4 py-3 flex justify-between items-center border-b border-gray-800">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-full bg-cover bg-center border border-emerald-500" style="background-image: url('https://files.catbox.moe/smngwm.png');"></div>
      <span class="font-bold text-lg tracking-wide">Boston George 420</span>
    </div>
    <div class="flex items-center space-x-2">
      <button onclick="openCartModal()" class="relative p-2 rounded-lg bg-gray-800 hover:bg-gray-700">
        <i data-lucide="shopping-cart" class="w-5 h-5 text-gray-200"></i>
        <span id="cart-badge" class="absolute -top-1 -right-1 bg-emerald-500 text-black text-xs font-bold w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
      </button>
    </div>
  </header>

  <!-- CONTENUTO PRINCIPALE -->
  <main class="p-4 space-y-5">
    <div class="space-y-3 pt-2" id="products-section">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-white tracking-wide">Catalogo Prodotti</h2>
      </div>
      <!-- CATEGORIE (Meet Up Per Prime) -->
      <div class="flex space-x-2 overflow-x-auto hide-scrollbar pb-1">
        <button onclick="filterCategory('ALL', this)" class="cat-btn px-3.5 py-2 rounded-xl bg-emerald-500 text-black text-xs font-bold whitespace-nowrap">Tutti</button>
        <button onclick="filterCategory('🤝 Roma (Meet Up)', this)" class="cat-btn px-3.5 py-2 rounded-xl bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs font-bold whitespace-nowrap">🤝 Roma (Meet Up)</button>
        <button onclick="filterCategory('🤝 Fondi (Meet Up)', this)" class="cat-btn px-3.5 py-2 rounded-xl bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs font-bold whitespace-nowrap">🤝 Fondi (Meet Up)</button>
        <button onclick="filterCategory('🇮🇹 Italia (Ship)', this)" class="cat-btn px-3.5 py-2 rounded-xl bg-gray-800 text-gray-300 text-xs font-medium whitespace-nowrap">🇮🇹 Italia (Ship)</button>
        <button onclick="filterCategory('🇪🇸 Spagna (Ship)', this)" class="cat-btn px-3.5 py-2 rounded-xl bg-gray-800 text-gray-300 text-xs font-medium whitespace-nowrap">🇪🇸 Spagna (Ship)</button>
        <button onclick="filterCategory('🇳🇱 Olanda (Ship)', this)" class="cat-btn px-3.5 py-2 rounded-xl bg-gray-800 text-gray-300 text-xs font-medium whitespace-nowrap">🇳🇱 Olanda (Ship)</button>
        <button onclick="filterCategory('🇺🇸 USA (Ship)', this)" class="cat-btn px-3.5 py-2 rounded-xl bg-gray-800 text-gray-300 text-xs font-medium whitespace-nowrap">🇺🇸 USA (Ship)</button>
      </div>
    </div>

    <!-- GRIGLIA PRODOTTI -->
    <div id="products-grid" class="grid grid-cols-2 gap-3">
      <div class="text-center py-8 text-gray-500 text-sm col-span-2">Caricamento prodotti...</div>
    </div>
  </main>

  <!-- MODALE DETTAGLIO PRODOTTO (FULL SCREEN STILE APP NATIVA) -->
  <div id="product-detail-modal" class="fixed inset-0 bg-[#121212] z-50 hidden flex-col overflow-y-auto hide-scrollbar pb-24 transition-transform duration-300 transform translate-y-full">
    <!-- Tasto Chiudi -->
    <button onclick="closeProductModal()" class="absolute top-4 right-4 bg-black/60 p-2 rounded-full z-10 backdrop-blur-md">
       <i data-lucide="x" class="w-6 h-6 text-white"></i>
    </button>

    <!-- Slider Media -->
    <div id="pd-media-container" class="w-full h-[40vh] bg-black relative"></div>

    <!-- Contenuto -->
    <div class="p-4 space-y-4">
        <div>
            <span id="pd-category" class="text-[10px] uppercase font-bold text-emerald-400 tracking-wider"></span>
            <h1 id="pd-title" class="text-2xl font-black text-white mt-1"></h1>
            <div class="text-xs text-gray-400 flex items-center space-x-3 mt-2">
                <span class="flex items-center"><i data-lucide="eye" class="w-3.5 h-3.5 mr-1 text-blue-400"></i> <span id="pd-views"></span> visite</span>
                <span class="flex items-center text-amber-400">★ 5.0 Vendite verificate</span>
            </div>
        </div>
        
        <!-- Descrizione con TAG Cliccabili -->
        <div class="bg-gray-900/60 border border-gray-800 p-3 rounded-xl">
          <p id="pd-desc" class="text-sm text-gray-300 whitespace-pre-wrap leading-relaxed"></p>
        </div>

        <h3 class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mt-4 mb-2">Seleziona una Variante</h3>
        <div id="pd-variants-list" class="space-y-2"></div>
        
        <h3 class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mt-8 mb-2">Spesso comprati insieme</h3>
        <div id="pd-related" class="grid grid-cols-2 gap-3 mb-8"></div>
    </div>

    <!-- Barra Acquisto Fissa in Basso -->
    <div class="fixed bottom-0 left-0 right-0 bg-[#1e1e1e] border-t border-gray-800 p-4 flex items-center space-x-3 z-20 pb-safe">
        <div class="flex items-center bg-gray-900 border border-gray-700 rounded-xl px-2 py-2">
            <button onclick="changeQty(-1)" class="text-white text-xl px-3 hover:text-emerald-400 transition">-</button>
            <span id="pd-qty-val" class="text-white font-bold w-6 text-center text-sm">1</span>
            <button onclick="changeQty(1)" class="text-white text-xl px-3 hover:text-emerald-400 transition">+</button>
        </div>
        <button onclick="addToCartFromModal()" class="flex-1 bg-gradient-to-r from-emerald-500 to-teal-600 text-black font-extrabold py-3.5 rounded-xl shadow-lg shadow-emerald-500/20 flex justify-center items-center text-sm">
            <i data-lucide="shopping-cart" class="w-4 h-4 mr-2"></i> Aggiungi <span id="pd-btn-price" class="ml-1"></span>
        </button>
    </div>
  </div>

  <!-- MODALE CARRELLO -->
  <div id="cart-modal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 hidden backdrop-blur-md">
    <div class="bg-[#181818] border border-gray-800 rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-gray-800 pb-3">
        <h3 class="font-bold text-lg text-white">Il tuo Carrello</h3>
        <button onclick="closeCartModal()" class="text-gray-400"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div id="cart-items-list" class="space-y-2 max-h-40 overflow-y-auto pr-1"></div>
      <div class="border-t border-gray-800 pt-3 space-y-3">
        <div class="flex justify-between text-sm font-bold text-white"><span>Totale:</span><span id="cart-total-price" class="text-emerald-400">€0</span></div>
        <div>
          <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider block mb-1">Indirizzo di Spedizione / Punto Meet Up</label>
          <textarea id="order-address-input" rows="2" placeholder="Inserisci indirizzo completo o luogo di incontro..." class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white outline-none"></textarea>
        </div>
        <button onclick="submitOrderProcess()" class="w-full bg-emerald-500 text-black font-extrabold py-3 rounded-xl text-xs uppercase shadow-lg shadow-emerald-500/20">Invia Ordine</button>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
    let allProducts = [];
    let cart = [];
    
    // Variabili per il Modale Dettaglio
    let currentProd = null;
    let selectedVariantIndex = 0;
    let currentQty = 1;

    // Converte gli username @telegram in link cliccabili
    function formatTextWithMentions(text) {
        if(!text) return "";
        return text.replace(/@(\w+)/g, '<a href="https://t.me/$1" target="_blank" class="text-blue-400 font-bold hover:underline">@$1</a>');
    }

    async function loadProducts() {
      try {
        const { data } = await db.from('products').select('*').eq('in_showcase', true).order('created_at', { ascending: false });
        allProducts = data || [];
        renderGrid(allProducts);
      } catch (err) {}
    }

    // Renderizza Griglia Piccola Principale
    function renderGrid(products) {
      const container = document.getElementById('products-grid');
      if (products.length === 0) { container.innerHTML = `<div class="col-span-2 text-center py-6 text-gray-500 text-xs">Nessun prodotto disponibile.</div>`; return; }

      container.innerHTML = products.map(p => {
        let media = p.media_list;
        if(typeof media === 'string') try { media = JSON.parse(media); } catch(e){ media = []; }
        const firstMedia = (media && media.length > 0) ? media[0] : { url: p.media_url, type: p.media_type };
        let opts = p.price_options;
        if(typeof opts === 'string') try { opts = JSON.parse(opts); } catch(e){ opts = []; }
        const startingPrice = opts.length > 0 ? opts[0].price : 0;

        return `
        <div onclick="openProductModal('${p.id}')" class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden shadow-lg cursor-pointer transform hover:scale-95 transition">
          ${firstMedia.type === 'video' 
            ? `<video class="w-full h-36 object-cover pointer-events-none" autoplay loop muted playsinline src="${firstMedia.url}"></video>`
            : `<img class="w-full h-36 object-cover pointer-events-none" src="${firstMedia.url || 'https://images.unsplash.com/photo-1527661591475-527312dd65f5'}" />`}
          <div class="p-3">
            <span class="text-[9px] uppercase font-bold text-emerald-400 block truncate">${p.category || ''}</span>
            <h3 class="font-bold text-sm text-white truncate">${p.name || ''}</h3>
            <p class="text-xs font-bold text-gray-300 mt-1">Da €${startingPrice}</p>
          </div>
        </div>
      `}).join('');
    }

    // Apre Dettaglio Prodotto (Schermo Intero)
    function openProductModal(prodId) {
        currentProd = allProducts.find(x => x.id === prodId);
        if(!currentProd) return;
        
        selectedVariantIndex = 0;
        currentQty = 1;

        // 1. Media
        let media = currentProd.media_list;
        if(typeof media === 'string') try { media = JSON.parse(media); } catch(e){ media = []; }
        if(!media || media.length === 0) media = [{ url: currentProd.media_url, type: currentProd.media_type }];
        
        let mediaHTML = `<div class="flex overflow-x-auto hide-scrollbar media-slider w-full h-full">`;
        media.forEach(m => {
            mediaHTML += `<div class="w-full h-full flex-shrink-0 media-item">`;
            if(m.type === 'video') mediaHTML += `<video class="w-full h-full object-cover" autoplay loop muted playsinline src="${m.url}"></video>`;
            else mediaHTML += `<img class="w-full h-full object-cover" src="${m.url}" />`;
            mediaHTML += `</div>`;
        });
        mediaHTML += `</div>`;
        if(media.length > 1) mediaHTML += `<div class="absolute bottom-2 right-2 bg-black/60 backdrop-blur-sm text-white text-[10px] font-bold px-2.5 py-1 rounded-full">1/${media.length} ↔ Scorri</div>`;
        document.getElementById('pd-media-container').innerHTML = mediaHTML;

        // 2. Testi
        document.getElementById('pd-category').innerText = currentProd.category;
        document.getElementById('pd-title').innerText = currentProd.name;
        document.getElementById('pd-desc').innerHTML = formatTextWithMentions(currentProd.description);
        document.getElementById('pd-views').innerText = Math.floor(Math.random() * 800) + 150; // Random views stile IG

        // 3. Varianti (Prezzi)
        let opts = currentProd.price_options;
        if(typeof opts === 'string') try { opts = JSON.parse(opts); } catch(e){ opts = []; }
        currentProd.parsedOpts = opts; // Cache
        
        const varContainer = document.getElementById('pd-variants-list');
        varContainer.innerHTML = opts.map((opt, idx) => `
            <div onclick="selectVariant(${idx})" id="var-box-${idx}" class="border border-gray-700 bg-gray-900 rounded-xl p-3 flex justify-between items-center cursor-pointer transition ${idx === 0 ? 'variant-selected' : 'text-gray-300'}">
                <span class="font-bold text-sm">${opt.qty}</span>
                <span class="font-extrabold text-sm">€${opt.price}</span>
            </div>
        `).join('');

        // 4. Prodotti Correlati
        const related = allProducts.filter(p => p.id !== prodId).sort(() => 0.5 - Math.random()).slice(0, 4);
        document.getElementById('pd-related').innerHTML = related.map(p => {
             let rm = p.media_list; if(typeof rm === 'string') try { rm = JSON.parse(rm); } catch(e){ rm = []; }
             const firstRm = (rm && rm.length > 0) ? rm[0] : { url: p.media_url, type: p.media_type };
             return `
             <div onclick="closeProductModal(); setTimeout(()=>openProductModal('${p.id}'), 300)" class="bg-gray-800 rounded-xl overflow-hidden cursor-pointer">
                ${firstRm.type === 'video' ? `<video class="w-full h-24 object-cover" muted src="${firstRm.url}"></video>` : `<img class="w-full h-24 object-cover" src="${firstRm.url}" />`}
                <div class="p-2 text-xs font-bold text-white truncate">${p.name}</div>
             </div>`
        }).join('');

        updateBottomBar();
        
        const modal = document.getElementById('product-detail-modal');
        modal.classList.remove('hidden');
        setTimeout(() => modal.classList.remove('translate-y-full'), 10);
    }

    function closeProductModal() {
        const modal = document.getElementById('product-detail-modal');
        modal.classList.add('translate-y-full');
        setTimeout(() => modal.classList.add('hidden'), 300);
    }

    function selectVariant(idx) {
        selectedVariantIndex = idx;
        const opts = currentProd.parsedOpts;
        opts.forEach((_, i) => {
            const box = document.getElementById(`var-box-${i}`);
            if(i === idx) {
                box.classList.add('variant-selected');
                box.classList.remove('text-gray-300');
            } else {
                box.classList.remove('variant-selected');
                box.classList.add('text-gray-300');
            }
        });
        updateBottomBar();
    }

    function changeQty(delta) {
        currentQty = Math.max(1, currentQty + delta);
        updateBottomBar();
        if(tg) tg.HapticFeedback?.selectionChanged();
    }

    function updateBottomBar() {
        document.getElementById('pd-qty-val').innerText = currentQty;
        const price = currentProd.parsedOpts[selectedVariantIndex].price;
        const total = (price * currentQty).toFixed(2);
        document.getElementById('pd-btn-price').innerText = `(€${total})`;
    }

    function addToCartFromModal() {
        const opt = currentProd.parsedOpts[selectedVariantIndex];
        const finalPrice = opt.price * currentQty;
        cart.push({ name: `${currentProd.name} - ${opt.qty}`, qty: currentQty, price: finalPrice });
        
        const badge = document.getElementById('cart-badge');
        badge.innerText = cart.length;
        badge.classList.remove('hidden');
        
        if (tg) tg.HapticFeedback?.notificationOccurred('success');
        closeProductModal();
    }

    // Funzioni Carrello (Classiche)
    function openCartModal() {
      if (cart.length === 0) return alert("Carrello vuoto!");
      document.getElementById('cart-items-list').innerHTML = cart.map((i, index) => `
        <div class="flex justify-between items-center bg-gray-900 p-2.5 rounded-xl border border-gray-800 text-xs">
          <div><div class="font-bold text-white">${i.name}</div><div class="text-gray-400">Qt: ${i.qty} - €${i.price}</div></div>
          <button onclick="removeFromCart(${index})" class="text-red-400 font-bold p-1">❌</button>
        </div>`).join('');
      document.getElementById('cart-total-price').innerText = `€${cart.reduce((s, i) => s + i.price, 0)}`;
      document.getElementById('cart-modal').classList.remove('hidden');
    }
    function closeCartModal() { document.getElementById('cart-modal').classList.add('hidden'); }
    function removeFromCart(index) { cart.splice(index, 1); if (cart.length === 0) { document.getElementById('cart-badge').classList.add('hidden'); closeCartModal(); } else { document.getElementById('cart-badge').innerText = cart.length; openCartModal(); } }

    async function submitOrderProcess() {
      const address = document.getElementById('order-address-input').value.trim();
      if (!address) return alert("Inserisci indirizzo o ritrovo!");
      const total = cart.reduce((s, item) => s + item.price, 0);
      const user = tg?.initDataUnsafe?.user || {};
      try {
        const res = await fetch("https://telegram-shop-9swy.onrender.com/api/order", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ cart, total, user_id: user.id || 0, username: user.username || "Anonimo", address })
        });
        if (res.ok) {
          closeCartModal(); cart = []; document.getElementById('cart-badge').classList.add('hidden');
          document.getElementById('success-panel-modal').classList.remove('hidden');
        }
      } catch (e) { alert("Errore connessione."); }
    }
    function closeSuccessPanel() { document.getElementById('success-panel-modal').classList.add('hidden'); if(tg) tg.close(); }

    function filterCategory(cat, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => { b.classList.remove('bg-emerald-500', 'text-black'); b.classList.add('bg-gray-800', 'text-gray-300'); });
      if (btn) { btn.classList.remove('bg-gray-800', 'text-gray-300'); btn.classList.add('bg-emerald-500', 'text-black'); }
      if (cat === 'ALL') renderGrid(allProducts);
      else renderGrid(allProducts.filter(p => p.category && p.category.includes(cat)));
    }

    loadProducts();
  </script>
</body>
</html>
