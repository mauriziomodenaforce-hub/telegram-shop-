<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BostonGeorge Shop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="pb-20">

  <!-- Header Vetrina -->
  <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 flex justify-between items-center shadow-lg">
    <div>
      <h1 class="text-xl font-bold text-amber-500 tracking-wide">BOSTON GEORGE</h1>
      <p class="text-xs text-slate-400">Official Telegram Vetrina</p>
    </div>
    <div class="flex items-center gap-2">
      <span class="bg-emerald-500/20 text-emerald-400 text-xs px-2.5 py-1 rounded-full border border-emerald-500/30 font-medium">
        <i class="fa-solid fa-circle text-[8px] animate-pulse mr-1"></i> Online
      </span>
    </div>
  </header>

  <!-- Banner Info Spedizioni -->
  <div class="m-4 p-3 bg-slate-800/80 rounded-xl border border-slate-700 text-xs space-y-1.5 shadow">
    <p class="flex items-center gap-2 text-slate-300">
      <i class="fa-solid fa-box text-amber-400"></i> Tutti i PRODOTTI sono in pronta consegna
    </p>
    <p class="flex items-center gap-2 text-slate-300">
      <i class="fa-solid fa-truck-fast text-blue-400"></i> Spedizioni veloci: 🇮🇹 Italia | 🇪🇸 Spagna | 🇨🇿 Rep. Ceca
    </p>
  </div>

  <!-- Griglia Prodotti -->
  <main class="px-4">
    <h2 class="text-xs font-semibold uppercase text-slate-400 tracking-wider mb-3">Prodotti in Vetrina</h2>
    
    <div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      
      <!-- Scheda Prodotto 1 -->
      <div class="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden shadow-xl flex flex-col justify-between">
        <div class="relative">
          <img src="https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=600" alt="Prodotto" class="w-full h-48 object-cover">
          <span class="absolute top-3 right-3 bg-amber-500 text-slate-950 font-bold text-xs px-2.5 py-1 rounded-lg shadow">
            Pronta Consegna
          </span>
        </div>
        
        <div class="p-4 flex-1 flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-start mb-2">
              <h3 class="font-bold text-lg text-white">iPhone 15 Pro Max</h3>
              <span class="text-amber-400 font-extrabold text-lg">€ 999.00</span>
            </div>
            <p class="text-slate-400 text-xs line-clamp-2 mb-4">
              Nuovo sigillato, spedizione tracciata e assicurata.
            </p>
          </div>

          <div class="pt-3 border-t border-slate-700/60 flex items-center justify-between">
            <span class="text-[11px] text-slate-400 flex items-center gap-1">
              <i class="fa-solid fa-location-dot text-slate-500"></i> Spedito da: 🇮🇹
            </span>
            <button onclick="orderProduct('iPhone 15 Pro Max', '999.00')" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs px-4 py-2.5 rounded-xl transition flex items-center gap-1.5 active:scale-95">
              <i class="fa-solid fa-cart-shopping"></i> Ordina Ora
            </button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Script Telegram WebApp Integration -->
  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    function orderProduct(title, price) {
      if (tg) {
        tg.sendData(JSON.stringify({
          action: "buy",
          title: title,
          price: price
        }));
      } else {
        alert(`Ordine richiesto per: ${title} (€${price})`);
      }
    }
  </script>
</body>
</html>
